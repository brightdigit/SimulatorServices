name: "CodeQL"

# Pull requests, a weekly scan and manual runs. No `push` trigger: a PR
# branch's pushes already run `pull_request`.
on:
  pull_request:
  schedule:
    - cron: '20 11 * * 3'
  workflow_dispatch:

concurrency:
  # event_name is part of the key so the weekly scan and a PR scan never
  # cancel each other; within one event type only the newest run survives.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    # CodeQL's Swift analysis needs a macOS runner, and the swift-tools-version
    # 6.4 manifest needs Swift 6.4, so it runs on the xcode-27 image.
    runs-on: ${{ (matrix.language == 'swift' && 'xcode-27') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'swift' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Xcode
      if: matrix.language == 'swift'
      run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

    - name: Verify Swift Version
      if: matrix.language == 'swift'
      run: |
        swift --version
        swift package --version

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Build
      run: swift build --disable-sandbox

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
